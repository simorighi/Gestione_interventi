# Progetto: <nome progetto>  ·  Team: <nome team>  ·  Data: <gg/mm/aaaa>  ·  v0.1
#
# ATTENZIONE: questo file va nel repository con valori DI ESEMPIO, non con le
# credenziali reali che usate a lezione. Un Secret Kubernetes non è cifrato
# di default: è solo codificato in base64. Non è un motivo per versionarlo
# con dati veri su Git — è comunque leggibile da chiunque abbia accesso al
# cluster o al manifest.
apiVersion: v1
kind: Secret
metadata:
  # ESEMPIO (Smart Maintenance): backend-secret
  name: <nome-componente>-secret
type: Opaque
stringData:
  # ISTRUZIONE: una riga per credenziale. stringData accetta testo in chiaro
  # nel file (Kubernetes lo codifica lui in base64 all'apply) — più leggibile
  # di 'data' per un esempio didattico.
  # ESEMPIO (Smart Maintenance):
  #   DB_PASSWORD: "cambiami-in-produzione"
  <NOME_CREDENZIALE_1>: "<valore-di-esempio-non-reale>"

# Checklist:
# [ ] i valori in questo file, così come li consegnate, NON sono quelli usati
#     davvero a lezione (sono placeholder o valori di esempio)
# [ ] il Deployment collega questo Secret con envFrom → secretRef
# [ ] se il vostro repository ha un file .env o simile con le credenziali
#     reali, è nel .gitignore, non committato
