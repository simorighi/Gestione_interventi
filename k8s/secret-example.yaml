# Progetto: Nordfacility  ·  Team: 1  ·  Data: 18/11/2026  ·  v1.0
#
# ATTENZIONE: valori DI ESEMPIO. Un Secret non è cifrato, è solo base64.
# Le credenziali reali NON vanno nel repository. Due modi per crearlo:
#
#  a) copiare questo file in k8s/secret.yaml (ignorato da Git, vedi
#     .gitignore), mettere i valori veri e fare apply di quello;
#  b) senza file, direttamente da riga di comando:
#       microk8s kubectl create secret generic web-secret \
#         --from-literal=DATABASE_URL='postgresql://...'
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  labels:
    app: web
type: Opaque
stringData:
  # Stringa di connessione al database Supabase (pooler), letta da
  # src/server/db.ts e prisma.config.ts.
  DATABASE_URL: "postgresql://utente:password-di-esempio@host-di-esempio.pooler.supabase.com:6543/postgres"

# Checklist:
# [x] i valori qui sono placeholder, non quelli reali
# [x] il Deployment collega questo Secret con envFrom -> secretRef (web-secret)
# [x] .env e k8s/secret.yaml non sono committati
