# Progetto: Nordfacility  ·  Team: 1  ·  Data: 25/11/2026  ·  v1.1
#
# Parametri NON sensibili del componente web/. Diventano variabili
# d'ambiente del container tramite envFrom (deployment-web.yaml).
# Le credenziali (DATABASE_URL, AUTH_SECRET) stanno nel Secret, non qui.
# Elenco completo e significato: docs/configuration.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  labels:
    app: web
data:
  # Next.js ascolta su questa interfaccia/porta: 0.0.0.0 perché il Service
  # deve raggiungere il Pod; 3000 = containerPort.
  HOSTNAME: "0.0.0.0"
  PORT: "3000"
  # Niente telemetria verso Vercel dal cluster.
  NEXT_TELEMETRY_DISABLED: "1"
  LOG_LEVEL: "info"
  # Durata del token di login in minuti (8 ore).
  AUTH_TOKEN_TTL_MIN: "480"
  # Swagger UI spento nel cluster (C7). "true" per riaccenderlo in un ambiente di test.
  API_DOCS: "false"
  # CORS_ORIGIN non serve: dietro l'Ingress frontend e API hanno la stessa origine.

# Checklist:
# [x] nessun valore qui è una credenziale
# [x] i nomi delle chiavi sono quelli letti da web/src/server/config.ts
# [ ] dopo ogni modifica: apply + rollout restart deploy/web
