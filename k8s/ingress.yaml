# Progetto: Nordfacility  ·  Team: 1  ·  Data: 18/11/2026  ·  v1.1
#
# Richiede l'addon 'ingress' di MicroK8s (microk8s enable ingress).
#
# Flusso:  browser ──► Ingress (nordfacility.local)
#                        ├─ /api/* ──► web-svc      ──► Pod web (Next.js) ──► DB Supabase
#                        └─ /      ──► frontend-svc ──► Pod frontend (nginx, SPA)
#
# Il frontend gira nel browser: le sue fetch('/api/...') tornano all'Ingress
# (stesso host, quindi niente CORS) e vengono girate al backend. Solo il
# backend conosce e usa DATABASE_URL.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nordfacility-ingress
spec:
  # Classe dell'ingress controller NGINX installato dall'addon MicroK8s.
  ingressClassName: public
  rules:
    # Host locale: aggiungere "127.0.0.1 nordfacility.local" al file hosts,
    # oppure usare curl --resolve nordfacility.local:80:127.0.0.1
    - host: nordfacility.local
      http:
        paths:
          # Il path più specifico vince: /api va al backend...
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: web-svc
                port:
                  number: 80
          # ...tutto il resto al frontend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80

# Checklist:
# [ ] addon 'ingress' abilitato (microk8s status)
# [ ] 'microk8s kubectl get svc' mostra web-svc e frontend-svc
# [ ] 'microk8s kubectl get ingress' mostra un ADDRESS
# [ ] curl http://nordfacility.local/            -> HTML della SPA
# [ ] curl http://nordfacility.local/api/health  -> {"status":"ok",...}
