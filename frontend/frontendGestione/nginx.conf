# Serve la SPA compilata. Le chiamate /api NON passano da qui: le instrada
# l'Ingress direttamente verso il backend (web-svc).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Usato dalle probe di Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # File con hash nel nome (generati da Vite): cache lunga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Qualsiasi altro percorso -> index.html (routing lato client della SPA).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
